# Builds the macOS app (Apple Silicon + Intel) as .dmg (install) and .zip (auto-update).
# Run it from the GitHub "Actions" tab → "Build macOS" → Run workflow, then download the artifacts.
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the ffmpeg binary for the target architecture
        if: matrix.arch == 'x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg

      - name: Build app
        run: npx electron-vite build

      - name: Package (.dmg + .zip, ad-hoc signed)
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: iloveframes-mac-${{ matrix.arch }}
          path: |
            release/*/*.dmg
            release/*/*.zip
          if-no-files-found: error
